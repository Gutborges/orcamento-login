<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --fundo: #F2F3F8; --superficie: #FFFFFF; --tinta: #1B1F3B; --texto2: #555B7A; --anil: #2B3190; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #12142A; --superficie: #1C1F3A; --tinta: #EEF0FA; --texto2: #A9AECB; --anil: #9EA4F0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo); color: var(--tinta);
         font: 400 15px/1.5 "Instrument Sans", system-ui, sans-serif; }
  main { max-width: 400px; background: var(--superficie); border-radius: 20px; padding: 28px 24px; }
  h1 { font: 700 26px/1.15 "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 8px; color: var(--anil); }
  p { margin: 0; color: var(--texto2); }
</style>
</head>
<body>
<main>
  <h1>Orçamento</h1>
  <p>Esta página é usada para entrar quando você conecta o Orçamento numa IA (Claude, ChatGPT). Se chegou aqui por um e-mail de confirmação, pode voltar para o app.</p>
</main>
</body>
</html>
